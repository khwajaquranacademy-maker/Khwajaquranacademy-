const PR=[["Alhamdulillah","الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ"],["Kalima Tayyiba","لَا إِلٰهَ إِلَّا اللّٰهُ مُحَمَّدٌ رَسُولُ اللّٰهِ"],["Kalima Shahadat","أَشْهَدُ أَنْ لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيكَ لَهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ"],["SubhanAllah","سُبْحَانَ اللّٰهِ وَبِحَمْدِهِ سُبْحَانَ اللّٰهِ الْعَظِيمِ"],["Astaghfirullah","أَسْتَغْفِرُ اللّٰهَ رَبِّي مِنْ كُلِّ ذَنْبٍ وَأَتُوبُ إِلَيْهِ"],["Durood","اللّٰهُمَّ صَلِّ عَلٰى مُحَمَّدٍ وَعَلٰى آلِ مُحَمَّدٍ"],["La hawla","لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللّٰهِ الْعَلِيِّ الْعَظِيمِ"],["Alhamdulillah + Kalima","الْحَمْدُ لِلَّهِ  •  لَا إِلٰهَ إِلَّا اللّٰهُ مُحَمَّدٌ رَسُولُ اللّٰهِ"]];
let A=[];
const TAF=["body","text","bio","syllabus"];
const FM={courses:["name","name_ur","details","details_ur","syllabus","duration","fee","sort"],pages:["slug","title","body"],fees:["sort","plan","classes","duration","fee","note"],reviews:["name","role","text","rating","visible"],teachers:["sort","name","role","qualification","bio","photo","visible"],posts:["title","summary","body","visible"],payments:["title","details"]};
const DEF={courses:{name:"New course",details:""},pages:()=>({slug:"page-"+Date.now(),title:"New page",body:""}),fees:{plan:"New plan"},reviews:{name:"Name",text:"Review text",visible:false},teachers:{name:"New teacher",visible:false},posts:{title:"New post",visible:false},payments:{title:"New method",details:""}};
async function admin(tab="ov",flt=""){document.documentElement.dir="ltr";
const{data:{session}}=await sb.auth.getSession();
if(!session){$("app").innerHTML=`<section><h2>Dashboard Login</h2><form id="lf"><input name="e" type="email" placeholder="Admin email" required><input name="p" type="password" placeholder="Password" required><button class="btn g">Login</button></form><a href="/">← Website</a></section>`;
$("lf").onsubmit=async e=>{e.preventDefault();const f=e.target;const{error}=await sb.auth.signInWithPassword({email:f.e.value,password:f.p.value});error?alert(error.message):admin()};return}
const tabs=[["ov","Overview"],["apps","Applications"],["msgs","Messages"],["posts","Blog"],["teachers","Teachers"],["reviews","Reviews"],["courses","Courses"],["fees","Fees"],["payments","Payments"],["pages","Pages"],["settings","Settings"]];
$("app").innerHTML=`<section><h2>Dashboard</h2><div class="tabs">${tabs.map(([k,l])=>`<button class="btn s ${k==tab?"g":"w"}" onclick="admin('${k}')">${l}</button>`).join("")}<button class="btn s w" onclick="sb.auth.signOut().then(()=>admin())">Logout</button><a class="btn s w" href="/">Website</a></div><div id="ad"></div></section><div id="pn"></div>`;
const el=$("ad");
if(tab=="ov"){const a=(await sb.from("applications").select("status")).data||[],m=await sb.from("messages").select("id",{count:"exact",head:true}),c=s=>a.filter(x=>x.status==s).length;
el.innerHTML=`<div class="stats"><div><b>${a.length}</b>Applications</div><div><b>${c("pending")}</b>Pending</div><div><b>${c("approved")}</b>Approved</div><div><b>${c("rejected")}</b>Rejected</div><div><b>${m.count||0}</b>Messages</div></div><div class="box" style="margin-top:14px"><b>Tips</b><p>Reviews, teachers and blog posts marked <b>Hidden</b> do not show on the website. Change them to <b>Show on website</b> after you edit them.</p><p>Open an application to see all details, add progress records (parents can see them on the Check Status page) and send emails.</p></div>`}
else if(tab=="apps"){let q=sb.from("applications").select("*").order("created_at",{ascending:false});if(flt)q=q.eq("status",flt);const{data}=await q;A=data;
el.innerHTML=`<div class="row2" style="margin:0 0 10px">${["","pending","approved","rejected"].map(s=>`<button class="btn s ${s==flt?"g":"w"}" onclick="admin('apps','${s}')">${s||"All"}</button>`).join("")}<button class="btn s" onclick="csv()">⬇ Export CSV</button></div><div class="box" style="overflow:auto"><table><tr><th>Student</th><th>Course</th><th>Status</th><th></th></tr>${data.map(a=>`<tr><td>${esc(a.student_name)}<br><small>${esc(a.email)}</small></td><td>${esc(a.course)}</td><td>${a.status}</td><td><button class="btn g s" onclick="vw(${a.id})">View</button></td></tr>`).join("")}</table></div>`}
else if(tab=="msgs"){const{data}=await sb.from("messages").select("*").order("created_at",{ascending:false});
el.innerHTML=data.length?data.map(m=>`<div class="box"><b>${esc(m.name)}</b> • ${esc(m.course)}<br><small>${new Date(m.created_at).toLocaleString()}</small><p>${esc(m.message)}</p><small>${esc(m.email)} ${esc(m.phone)}</small><div class="row2">${m.email?`<a class="btn g s" target="_blank" href="https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(m.email)}&su=${encodeURIComponent("Khwaja Quran Academy")}&body=${encodeURIComponent("Assalamu Alaikum "+m.name+",\n\nThank you for contacting Khwaja Quran Academy.\n\n\nJazakAllah Khair,\nKhwaja Quran Academy")}">✉️ Reply</a>`:""}${m.phone?`<a class="btn w s" target="_blank" href="https://wa.me/${String(m.phone).replace(/\D/g,"")}">💬 WhatsApp</a>`:""}</div></div>`).join(""):"<p>No messages yet.</p>"}
else if(tab=="settings"){const K=[["ticker","Top scrolling text"],["announce","Announcement bar text (optional)"],["announce_link","Announcement link (optional)"],["live","Live session link (Teams / Meet / Zoom)"],["email","Email"],["whatsapp","WhatsApp number (with country code, no +)"],["color","Theme colour"],["hero","Hero background photo URL"],["video","YouTube video link (optional)"],["trust","Trust badge text (optional)"],["discount","Discount / offer text on Fee page (optional)"],["about","About us text (footer)"],["teachers","Teachers (simple list): one per line, Name|Role"],["stats","Stats: one per line, Value|Label (e.g. 50+|Teachers)"],["features","Features: one per line, icon|Title|Description (empty = default list)"],["address","Address (optional)"],["pcity","Prayer times: city"],["pcountry","Prayer times: country"],["pmethod","Prayer times: method number (1 = Karachi)"],["fb","Facebook link"],["ig","Instagram link"],["yt","YouTube channel link"]],TA=["teachers","stats","about","features"];
el.innerHTML=`<div class="box"><b>Top scrolling bar: tap one to use it</b><br>${PR.map((p,i)=>`<button class="btn w s" style="margin:4px" onclick="setT(${i})">${p[0]}</button>`).join("")}</div><form id="sf">${K.map(([k,l])=>`<label>${l}<${k=="color"?`input type="color"`:(TA.includes(k)?`textarea rows="4"`:"input")} name="${k}" ${TA.includes(k)?`>${esc(S[k])}</textarea`:`value="${esc(S[k])}"`}></label>`).join("")}<button class="btn g">Save</button></form>`;
$("sf").onsubmit=async e=>{e.preventDefault();const{error}=await sb.from("settings").upsert(K.map(([k])=>({key:k,value:e.target[k].value})));alert(error?error.message:"Saved")}}
else{const tb=tab,F=FM[tb],{data}=await sb.from(tb).select("*").order("id");
el.innerHTML=(tb=="pages"?`<p>Use ## for a heading and - for a bullet point.</p>`:"")+data.map(r=>`<div class="box" data-t="${tb}" data-id="${r.id}">${F.map(f=>`<label>${f}${f=="visible"?`<select data-f="visible"><option value="true" ${r[f]!==false?"selected":""}>Show on website</option><option value="false" ${r[f]===false?"selected":""}>Hidden</option></select>`:TAF.includes(f)?`<textarea data-f="${f}" rows="8">${esc(r[f])}</textarea>`:`<input data-f="${f}" value="${esc(r[f])}">`}</label>`).join("")}<button class="btn g s" onclick="sv(this)">Save</button> <button class="btn w s" onclick="dl(this)">Delete</button></div>`).join("")+`<button class="btn" onclick="ad('${tb}')">+ Add</button>`}}
async function setT(i){S.ticker=PR[i][1];const{error}=await sb.from("settings").upsert({key:"ticker",value:PR[i][1]});document.querySelector("[name=ticker]").value=PR[i][1];alert(error?error.message:"Top bar updated")}
function csv(){if(!A.length)return;const k=Object.keys(A[0]),q=v=>`"${String(v??"").replace(/"/g,'""')}"`,s=[k.join(","),...A.map(r=>k.map(c=>q(r[c])).join(","))].join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+s],{type:"text/csv"}));a.download="applications.csv";a.click()}
async function vw(id){const a=A.find(x=>x.id==id),nm=a.student_name,{data:lg}=await sb.from("progress_logs").select("*").eq("application_id",id).order("log_date",{ascending:false}),mail=(su,b)=>`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(a.email)}&su=${encodeURIComponent(su)}&body=${encodeURIComponent(b)}`;
const sg=`\n\nJazakAllah Khair,\nKhwaja Quran Academy\n${S.email}\nWhatsApp: +${S.whatsapp}`;
const E=[["Approved",mail("Your admission is approved - Khwaja Quran Academy",`Assalamu Alaikum ${nm},\n\nJazakAllah for applying to Khwaja Quran Academy. We are happy to inform you that your application for ${a.course} has been approved. Our team will contact you to arrange your demo class and timings.`+sg)],["Need more info",mail("More information needed - Khwaja Quran Academy",`Assalamu Alaikum ${nm},\n\nThank you for applying for ${a.course}. To complete your admission, please reply with the following information:\n- \n- `+sg)],["Not approved",mail("Your application - Khwaja Quran Academy",`Assalamu Alaikum ${nm},\n\nThank you for your interest in Khwaja Quran Academy. Unfortunately we are unable to confirm your application right now. Please contact us if you have any question.`+sg)]];
const rows=Object.entries(a).filter(([k])=>k!="id"&&k!="admin_note").map(([k,v])=>`<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join("");
$("pn").innerHTML=`<div class="pg"><button class="btn w s" onclick="cl()">← Back</button><h1>${esc(nm)}</h1><div class="box" style="overflow:auto"><table class="dv">${rows}</table></div><h3>Status: ${a.status}</h3><button class="btn g s" onclick="st(${a.id},'approved')">Approve</button> <button class="btn w s" onclick="st(${a.id},'rejected')">Reject</button> <button class="btn w s" onclick="st(${a.id},'pending')">Pending</button>
<h3>Private note</h3><textarea id="an" rows="3">${esc(a.admin_note)}</textarea><button class="btn g s" onclick="svn(${a.id})">Save note</button>
<h3>Progress records</h3><div class="box"><div class="row2"><input type="date" id="ld_" value="${new Date().toISOString().slice(0,10)}"><select id="la"><option>Present</option><option>Absent</option><option>Excused</option></select></div><input id="ll" placeholder="Lesson (e.g. Surah An-Naba 1-10)"><input id="ln" placeholder="Note for parents (optional)"><button class="btn g s" onclick="addLog(${a.id})">Add record</button></div><div style="overflow:auto"><table><tr><th>Date</th><th>Att.</th><th>Lesson</th><th>Note</th><th></th></tr>${(lg||[]).map(l=>`<tr><td>${l.log_date}</td><td>${esc(l.attendance)}</td><td>${esc(l.lesson)}</td><td>${esc(l.note)}</td><td><button class="btn w s" onclick="delLog(${l.id},${a.id})">✕</button></td></tr>`).join("")}</table></div>
<h3>Email ${esc(a.email)}</h3>${E.map(([l,u])=>`<a class="btn s" target="_blank" href="${u}">✉️ ${l}</a>`).join(" ")}<p><small>Opens Gmail with the message ready. Sign in to ${esc(S.email)} in Gmail so it is sent from the academy address.</small></p><h3>WhatsApp</h3><a class="btn s" target="_blank" href="https://wa.me/${String(a.whatsapp||a.phone||"").replace(/\D/g,"")}">💬 Open WhatsApp</a></div>`;$("pn").classList.add("on");$("pn").scrollTop=0}
async function svn(id){const v=$("an").value;const{error}=await sb.from("applications").update({admin_note:v}).eq("id",id);if(!error)A.find(x=>x.id==id).admin_note=v;alert(error?error.message:"Saved")}
async function addLog(id){await sb.from("progress_logs").insert({application_id:id,log_date:$("ld_").value,attendance:$("la").value,lesson:$("ll").value,note:$("ln").value});vw(id)}
async function delLog(l,id){await sb.from("progress_logs").delete().eq("id",l);vw(id)}
async function sv(b){const x=b.parentElement,o={};x.querySelectorAll("[data-f]").forEach(i=>o[i.dataset.f]=i.value);if(o.sort==="")delete o.sort;if(o.rating==="")delete o.rating;const{error}=await sb.from(x.dataset.t).update(o).eq("id",x.dataset.id);alert(error?error.message:"Saved")}
async function dl(b){if(!confirm("Delete?"))return;const x=b.parentElement;await sb.from(x.dataset.t).delete().eq("id",x.dataset.id);admin(x.dataset.t)}
async function ad(tb){const d=DEF[tb];await sb.from(tb).insert(typeof d=="function"?d():d);admin(tb)}
async function st(id,s){await sb.from("applications").update({status:s}).eq("id",id);cl();admin("apps")}
(async()=>{await getD();render();setTimeout(()=>$("ld").classList.add("off"),900)})();
</script></body></html>
