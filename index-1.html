const render=()=>isAdmin?admin():pub();
const CF=["name","name_ur","details","details_ur","duration","fee","sort"],PF=["title","details"];
async function admin(tab="apps"){document.documentElement.dir="ltr";
const{data:{session}}=await sb.auth.getSession();
if(!session){$("app").innerHTML=`<section><h2>Dashboard Login</h2><form id="lf"><input name="e" type="email" placeholder="Admin email" required><input name="p" type="password" placeholder="Password" required><button class="btn g">Login</button></form><a href="/">← Website</a></section>`;
$("lf").onsubmit=async e=>{e.preventDefault();const f=e.target;const{error}=await sb.auth.signInWithPassword({email:f.e.value,password:f.p.value});error?alert(error.message):admin()};return}
const tabs=[["apps","Applications"],["courses","Courses"],["payments","Payments"],["settings","Settings"]];
$("app").innerHTML=`<section><h2>Dashboard</h2><div class="tabs">${tabs.map(([k,l])=>`<button class="btn ${k==tab?"g":"w"}" onclick="admin('${k}')">${l}</button>`).join("")}<button class="btn w" onclick="sb.auth.signOut().then(()=>admin())">Logout</button><a class="btn w" href="/">Website</a></div><div id="ad"></div></section>`;
const el=$("ad");
if(tab=="apps"){const{data}=await sb.from("applications").select("*").order("created_at",{ascending:false});
el.innerHTML=`<div class="box" style="overflow:auto"><table><tr><th>Student</th><th>Age</th><th>Course</th><th>Contact</th><th>Status</th><th></th></tr>${data.map(a=>`<tr><td>${esc(a.student_name)}<br><small>${esc(a.parent_name)}</small></td><td>${a.age}</td><td>${esc(a.course)}</td><td>${esc(a.email)}<br>${esc(a.phone)}</td><td>${a.status}</td><td><button class="btn g s" onclick="st(${a.id},'approved')">Approve</button> <button class="btn w s" onclick="st(${a.id},'rejected')">Reject</button></td></tr>`).join("")}</table></div>`}
else if(tab=="settings"){const K=[["ticker","Top scrolling text"],["live","Live session link"],["email","Email"],["whatsapp","WhatsApp number (with country code, no +)"],["color","Theme colour"],["hero","Hero background photo URL"],["trust","Trust badge text (optional)"],["about","About us text"],["teachers","Teachers: one per line, Name|Role"],["stats","Stats: one per line, Value|Label (e.g. 50+|Teachers)"],["privacy","Privacy & Security text"],["terms","Terms & Conditions text"],["refund","Refund Policy text"]],TA=["teachers","stats","about","privacy","terms","refund"];
el.innerHTML=`<form id="sf">${K.map(([k,l])=>`<label>${l}<${k=="color"?`input type="color"`:(TA.includes(k)?`textarea rows="4"`:"input")} name="${k}" ${TA.includes(k)?`>${esc(S[k])}</textarea`:`value="${esc(S[k])}"`}></label>`).join("")}<button class="btn g">Save</button></form>`;
$("sf").onsubmit=async e=>{e.preventDefault();const{error}=await sb.from("settings").upsert(K.map(([k])=>({key:k,value:e.target[k].value})));alert(error?error.message:"Saved")}}
else{const tb=tab,F=tb=="courses"?CF:PF,{data}=await sb.from(tb).select("*").order("id");
el.innerHTML=data.map(r=>`<div class="box" data-t="${tb}" data-id="${r.id}">${F.map(f=>`<label>${f}<input data-f="${f}" value="${esc(r[f])}"></label>`).join("")}<button class="btn g s" onclick="sv(this)">Save</button> <button class="btn w s" onclick="dl(this)">Delete</button></div>`).join("")+`<button class="btn" onclick="ad('${tb}')">+ Add</button>`}}
async function sv(b){const x=b.parentElement,o={};x.querySelectorAll("[data-f]").forEach(i=>o[i.dataset.f]=i.value);if(o.sort==="")delete o.sort;const{error}=await sb.from(x.dataset.t).update(o).eq("id",x.dataset.id);alert(error?error.message:"Saved")}
async function dl(b){if(!confirm("Delete?"))return;const x=b.parentElement;await sb.from(x.dataset.t).delete().eq("id",x.dataset.id);admin(x.dataset.t)}
async function ad(tb){await sb.from(tb).insert(tb=="courses"?{name:"New course",details:""}:{title:"New method",details:""});admin(tb)}
async function st(id,s){await sb.from("applications").update({status:s}).eq("id",id);admin("apps")}
(async()=>{await getD();render();setTimeout(()=>$("ld").classList.add("off"),900)})();
</script></body></html>
