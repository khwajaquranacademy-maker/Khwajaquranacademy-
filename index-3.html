async function admin(tab="apps"){document.documentElement.dir="ltr";
const{data:{session}}=await sb.auth.getSession();
if(!session){$("app").innerHTML=`<section><h2>Dashboard Login</h2><form id="lf"><input name="e" type="email" placeholder="Admin email" required><input name="p" type="password" placeholder="Password" required><button class="btn g">Login</button></form><a href="/">← Website</a></section>`;
$("lf").onsubmit=async e=>{e.preventDefault();const f=e.target;const{error}=await sb.auth.signInWithPassword({email:f.e.value,password:f.p.value});error?alert(error.message):admin()};return}
const tabs=[["apps","Applications"],["msgs","Messages"],["courses","Courses"],["fees","Fees"],["payments","Payments"],["pages","Pages"],["settings","Settings"]];
$("app").innerHTML=`<section><h2>Dashboard</h2><div class="tabs">${tabs.map(([k,l])=>`<button class="btn ${k==tab?"g":"w"}" onclick="admin('${k}')">${l}</button>`).join("")}<button class="btn w" onclick="sb.auth.signOut().then(()=>admin())">Logout</button><a class="btn w" href="/">Website</a></div><div id="ad"></div></section><div id="pn"></div>`;
const el=$("ad");
if(tab=="apps"){const{data}=await sb.from("applications").select("*").order("created_at",{ascending:false});A=data;
el.innerHTML=`<div class="box" style="overflow:auto"><table><tr><th>Student</th><th>Course</th><th>Status</th><th></th></tr>${data.map(a=>`<tr><td>${esc(a.student_name)}<br><small>${esc(a.email)}</small></td><td>${esc(a.course)}</td><td>${a.status}</td><td><button class="btn g s" onclick="vw(${a.id})">View</button></td></tr>`).join("")}</table></div>`}
else if(tab=="msgs"){const{data}=await sb.from("messages").select("*").order("created_at",{ascending:false});
el.innerHTML=data.length?data.map(m=>`<div class="box"><b>${esc(m.name)}</b> • ${esc(m.course)}<br><small>${new Date(m.created_at).toLocaleString()}</small><p>${esc(m.message)}</p><small>${esc(m.email)} ${esc(m.phone)}</small><div class="row2"><a class="btn g s" target="_blank" href="https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(m.email)}&su=${encodeURIComponent("Khwaja Quran Academy")}&body=${encodeURIComponent("Assalamu Alaikum "+m.name+",\n\nThank you for contacting Khwaja Quran Academy.\n\n\nJazakAllah Khair,\nKhwaja Quran Academy")}">✉️ Reply</a>${m.phone?`<a class="btn w s" target="_blank" href="https://wa.me/${String(m.phone).replace(/\D/g,"")}">💬 WhatsApp</a>`:""}</div></div>`).join(""):"<p>No messages yet.</p>"}
else if(tab=="settings"){const K=[["ticker","Top scrolling text"],["live","Live session link (Teams / Meet / Zoom)"],["email","Email"],["whatsapp","WhatsApp number (with country code, no +)"],["color","Theme colour"],["hero","Hero background photo URL"],["trust","Trust badge text (optional)"],["about","About us text (footer)"],["teachers","Teachers: one per line, Name|Role"],["stats","Stats: one per line, Value|Label (e.g. 50+|Teachers)"],["address","Address (optional)"],["fb","Facebook link"],["ig","Instagram link"],["yt","YouTube link"]],TA=["teachers","stats","about"];
el.innerHTML=`<div class="box"><b>Top scrolling bar: tap one to use it</b><br>${PR.map((p,i)=>`<button class="btn w s" style="margin:4px" onclick="setT(${i})">${p[0]}</button>`).join("")}</div><form id="sf">${K.map(([k,l])=>`<label>${l}<${k=="color"?`input type="color"`:(TA.includes(k)?`textarea rows="4"`:"input")} name="${k}" ${TA.includes(k)?`>${esc(S[k])}</textarea`:`value="${esc(S[k])}"`}></label>`).join("")}<button class="btn g">Save</button></form>`;
$("sf").onsubmit=async e=>{e.preventDefault();const{error}=await sb.from("settings").upsert(K.map(([k])=>({key:k,value:e.target[k].value})));alert(error?error.message:"Saved")}}
else{const tb=tab,F=tb=="courses"?CF:tb=="pages"?["slug","title","body"]:tb=="fees"?["sort","plan","classes","duration","fee","note"]:PF,{data}=await sb.from(tb).select("*").order("id");
el.innerHTML=(tb=="pages"?`<p>Use ## for a heading and - for a bullet point.</p>`:"")+data.map(r=>`<div class="box" data-t="${tb}" data-id="${r.id}">${F.map(f=>`<label>${f}${f=="body"?`<textarea data-f="${f}" rows="10">${esc(r[f])}</textarea>`:`<input data-f="${f}" value="${esc(r[f])}">`}</label>`).join("")}<button class="btn g s" onclick="sv(this)">Save</button> <button class="btn w s" onclick="dl(this)">Delete</button></div>`).join("")+`<button class="btn" onclick="ad('${tb}')">+ Add</button>`}}
async function setT(i){S.ticker=PR[i][1];const{error}=await sb.from("settings").upsert({key:"ticker",value:PR[i][1]});document.querySelector("[name=ticker]").value=PR[i][1];alert(error?error.message:"Top bar updated")}
function vw(id){const a=A.find(x=>x.id==id),nm=a.student_name,mail=(su,b)=>`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(a.email)}&su=${encodeURIComponent(su)}&body=${encodeURIComponent(b)}`;
const sg=`\n\nJazakAllah Khair,\nKhwaja Quran Academy\n${S.email}\nWhatsApp: +${S.whatsapp}`;
const E=[["Approved",mail("Your admission is approved - Khwaja Quran Academy",`Assalamu Alaikum ${nm},\n\nJazakAllah for applying to Khwaja Quran Academy. We are happy to inform you that your application for ${a.course} has been approved. Our team will contact you to arrange your demo class and timings.`+sg)],["Need more info",mail("More information needed - Khwaja Quran Academy",`Assalamu Alaikum ${nm},\n\nThank you for applying for ${a.course}. To complete your admission, please reply with the following information:\n- \n- `+sg)],["Not approved",mail("Your application - Khwaja Quran Academy",`Assalamu Alaikum ${nm},\n\nThank you for your interest in Khwaja Quran Academy. Unfortunately we are unable to confirm your application right now. Please contact us if you have any question.`+sg)]];
const rows=Object.entries(a).filter(([k])=>k!="id").map(([k,v])=>`<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join("");
$("pn").innerHTML=`<div class="pg"><button class="btn w s" onclick="cl()">← Back</button><h1>${esc(nm)}</h1><div class="box" style="overflow:auto"><table class="dv">${rows}</table></div><h3>Status: ${a.status}</h3><button class="btn g s" onclick="st(${a.id},'approved')">Approve</button> <button class="btn w s" onclick="st(${a.id},'rejected')">Reject</button> <button class="btn w s" onclick="st(${a.id},'pending')">Pending</button><h3>Email ${esc(a.email)}</h3>${E.map(([l,u])=>`<a class="btn s" target="_blank" href="${u}">✉️ ${l}</a>`).join(" ")}<p><small>Opens Gmail with the message ready. Sign in to ${esc(S.email)} in Gmail so it is sent from the academy address.</small></p><h3>WhatsApp</h3><a class="btn s" target="_blank" href="https://wa.me/${String(a.whatsapp||a.phone||"").replace(/\D/g,"")}">💬 Open WhatsApp</a></div>`;$("pn").classList.add("on");$("pn").scrollTop=0}
async function sv(b){const x=b.parentElement,o={};x.querySelectorAll("[data-f]").forEach(i=>o[i.dataset.f]=i.value);if(o.sort==="")delete o.sort;const{error}=await sb.from(x.dataset.t).update(o).eq("id",x.dataset.id);alert(error?error.message:"Saved")}
async function dl(b){if(!confirm("Delete?"))return;const x=b.parentElement;await sb.from(x.dataset.t).delete().eq("id",x.dataset.id);admin(x.dataset.t)}
async function ad(tb){await sb.from(tb).insert(tb=="courses"?{name:"New course",details:""}:tb=="pages"?{slug:"page-"+Date.now(),title:"New page",body:""}:tb=="fees"?{plan:"New plan"}:{title:"New method",details:""});admin(tb)}
async function st(id,s){await sb.from("applications").update({status:s}).eq("id",id);cl();admin("apps")}
(async()=>{await getD();render();setTimeout(()=>$("ld").classList.add("off"),900)})();
</script></body></html>
